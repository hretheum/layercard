name = "layercard"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "hretheum.com/k", zone_name = "hretheum.com" },
  { pattern = "hretheum.com/k/*", zone_name = "hretheum.com" },
]

# Counter namespace: change it to start the chain counter from zero (e.g. before an event).
[vars]
STATS_NAME = "event-2026-11-17"

# The card app is built into public/k (see apps/card/vite.config.ts).
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/k/room/*", "/k/api/*", "/k/", "/k/host/", "/k/web", "/k/code", "/k/content/contact.vcf"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
